name: Tests
on:
  push:
  pull_request:
  schedule:
    # Weekly, so advisories published after the last push still surface.
    - cron: '23 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: Laravel ${{ matrix.laravel }}, PHP ${{ matrix.php }} ${{ matrix.dependencies }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: '12', testbench: '^10.12', php: '8.2', dependencies: lowest }
          - { laravel: '12', testbench: '^10.12', php: '8.2', dependencies: highest }
          - { laravel: '12', testbench: '^10.12', php: '8.5', dependencies: highest }
          - { laravel: '13', testbench: '^11.3',  php: '8.3', dependencies: highest }
          - { laravel: '13', testbench: '^11.3',  php: '8.5', dependencies: highest }

    env:
      BACKUP_MANAGER_TEST_MYSQL_PASSWORD: root

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start MySQL
        run: |
          sudo systemctl start mysql.service
          mysql -uroot -proot -e 'CREATE DATABASE backup_manager_test'

      - name: Select Laravel ${{ matrix.laravel }} (through Testbench)
        run: |
          composer require --no-update --dev "orchestra/testbench:${{ matrix.testbench }}"

      - name: Download dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Show resolved key packages
        run: composer show | grep -E '^(backup-manager/backup-manager|laravel/framework|league/flysystem |orchestra/testbench |phpunit/phpunit|symfony/(console|process) )'

      - name: Run tests
        run: vendor/bin/phpunit

  audit:
    name: Composer audit
    runs-on: ubuntu-24.04
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Audit dependencies for security advisories
        run: composer audit
